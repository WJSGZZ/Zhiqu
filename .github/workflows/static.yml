# 发布在线问卷：只上传网页本身（首页、三份问卷和 assets），不带数据和技能文件
name: Deploy questionnaire site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "assets/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 新的发布排在后面时，跳过中间已过时的那些，只发最新一版
concurrency:
  group: "zhiqu-site"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html gaokao.html grad.html career.html _site/
          cp -R assets _site/assets
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
